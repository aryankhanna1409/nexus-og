   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(13.367422 83.355078)">simulator: 17 KPIs x 12 cells,</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(30.106172 90.918359)">events, CDR CSV</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="156.24" y="59.50875" transform="rotate(-0 156.24 59.50875)">2. Call analysis</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(127.725938 83.228203)">C library parses CSV,</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(125.553203 91.518281)">stats + robust outliers</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="259.2" y="60.065063" transform="rotate(-0 259.2 60.065063)">3. Detect</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(223.276875 83.221641)">4 detectors per KPI series</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(230.032969 90.928203)">-&gt; anomaly episodes</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="362.16" y="60.222281" transform="rotate(-0 362.16 60.222281)">4. Correlate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(332.557109 83.355078)">cluster, score causes,</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(342.569844 91.518281)">build timeline</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="465.12" y="60.065063" transform="rotate(-0 465.12 60.065063)">5. Store</text>
   </g>

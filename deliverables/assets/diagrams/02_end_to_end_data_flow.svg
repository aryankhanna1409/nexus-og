    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(434.268594 91.005313)">incidents, events (DB)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="53.28" y="185.432828" transform="rotate(-0 53.28 185.432828)">6. Investigate</text>
   </g>

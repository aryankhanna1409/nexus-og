   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="129.6" y="61.415437" transform="rotate(-0 129.6 61.415437)">ANALYZE</text>

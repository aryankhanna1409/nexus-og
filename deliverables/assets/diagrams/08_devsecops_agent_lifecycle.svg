   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="216" y="61.415437" transform="rotate(-0 216 61.415437)">PLAN</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(192.238828 81.675547)">propose action +</text>

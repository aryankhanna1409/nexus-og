    <text style="font-size: 7.4px; font-family: 'Calibri'; text-anchor: middle; fill: #5b6b7f" x="345.6" y="152.33" transform="rotate(-0 345.6 152.33)">denied or blocked: skip ACT, close with a report</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 8.4px; font-family: 'Calibri'; text-anchor: start; fill: #5b6b7f" x="7.2" y="16.563" transform="rotate(-0 7.2 16.563)">Run phase never moves backwards; the planner is deterministic (one playbook per scenario).</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.2px; font-family: 'Calibri'; text-anchor: start; fill: #1b2a41" x="7.2" y="171.309578" transform="rotate(-0 7.2 171.309578)">Every action row stores tool, risk class, rationale (before execution), arguments and result.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.2px; font-family: 'Calibri'; text-anchor: start; fill: #1b2a41" x="7.2" y="190.699609" transform="rotate(-0 7.2 190.699609)">Every proposal, block, approval, denial, execution and closure writes a hash-chained audit row.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.2px; font-family: 'Calibri'; text-anchor: start; fill: #1b2a41" x="7.2" y="210.151781" transform="rotate(-0 7.2 210.151781)">Scenarios: vulnerable_dependency, failed_ci, production_anomaly. The LLM never picks tools or arguments.</text>
   </g>

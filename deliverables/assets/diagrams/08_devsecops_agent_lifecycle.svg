   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="302.4" y="61.414734" transform="rotate(-0 302.4 61.414734)">ACT</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(286.213047 81.786563)">policy gate;</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(290.041172 89.488203)">approval</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="388.8" y="61.415437" transform="rotate(-0 388.8 61.415437)">VERIFY</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(369.192891 81.580391)">tests, re-scan,</text>
    <text style="font-size: 7px; font-family: 'Calibri'; fill: #5b6b7f" transform="translate(367.571406 89.488203)">recovery check</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri'; text-anchor: middle; fill: #1b2a41" x="475.2" y="61.415437" transform="rotate(-0 475.2 61.415437)">CLOSE</text>
   </g>
   <g id="text_12">

# Aegis-Net local stack: `make env` (once) then `docker compose up --build`.
# Ports are bound to 127.0.0.1 only. All data is synthetic.
name: aegis-net

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make env" to create .env}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      AEGIS_API_TOKENS: ${AEGIS_API_TOKENS:?run "make env" to create .env}
      AEGIS_BOOTSTRAP_DEMO: ${AEGIS_BOOTSTRAP_DEMO:-true}
      AEGIS_RATE_LIMIT_PER_MINUTE: ${AEGIS_RATE_LIMIT_PER_MINUTE:-600}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MODEL_NAME: ${MODEL_NAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      AGENT_ALLOW_HIGH_RISK: ${AGENT_ALLOW_HIGH_RISK:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - aegis-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  aegis-data:

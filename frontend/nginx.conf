# SPA + same-origin API proxy. Only /api is forwarded; /metrics and /docs stay internal.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri /index.html; }
}
